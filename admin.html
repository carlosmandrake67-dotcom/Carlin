<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="hero"><h1>🎉 PARABÉNS, VOCÊ CONSEGUIU!</h1><p>Você encontrou o painel administrativo oficial.</p><button onclick="loadLogs()">Ver logs do laboratório</button><pre id="logs"></pre></main>
<script>async function loadLogs(){const r=await fetch("/api/logs",{headers:{Authorization:"Bearer "+localStorage.token}});logs.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
