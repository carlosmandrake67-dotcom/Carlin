<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="card"><h1>Área do cliente</h1><form id="f"><input name="username" placeholder="Usuário" required><input name="password" type="password" placeholder="Senha" required><button>Entrar</button></form><p id="msg"></p><small>Laboratório: usuário <b>tester</b>, senha <b>change-me</b></small></main>
<script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(d.ok){localStorage.token=d.token;msg.textContent="Login realizado."}else msg.textContent=d.error}</script></body></html>
